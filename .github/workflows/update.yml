name: 공모사업 자동 업데이트

on:
  schedule:
    # 매일 오전 8시 (한국 시간 = UTC+9 → UTC 23:00 전날)
    - cron: "0 23 * * *"
  # 수동 실행 허용
  workflow_dispatch:
  # 스크래퍼/워크플로우를 수정해 push하면 즉시 재수집 (검증용)
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - ".github/workflows/update.yml"

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 변경사항 push 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install playwright requests beautifulsoup4

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 스크래퍼 실행
        run: python scraper.py
        continue-on-error: true   # 일부 사이트 실패해도 워크플로우 계속

      - name: 변경 여부 확인
        id: diff
        run: |
          git diff --quiet "공모사업 일정/projects.json" && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: projects.json 커밋 & 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "공모사업 일정/projects.json"
          git commit -m "chore: 공모사업 데이터 자동 갱신 $(date +'%Y-%m-%d')"
          # 실행 중 다른 커밋이 들어왔어도 충돌 없이 푸시되도록 최신본을 받아 rebase
          git pull --rebase --autostash origin main
          git push
